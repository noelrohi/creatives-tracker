function tagLedger(dim, state, opts = {}) {
  const rows = DIMS[dim];
  const un = UNTAGGED[state.coverage];
  const max = Math.max(...rows.map(r => r.rev), un.rev);
  const gated = state.coverage === "low";
  const limit = opts.limit ?? rows.length;
  const shown = rows.slice(0, limit);
  const row = (r, i, n) => {
    const mix = 100 - (i / Math.max(1, n)) * 45;
    const color = `color-mix(in oklab, var(--attr-known) ${mix}%, var(--card))`;
    const sel = opts.selected === r.name;
    return `<div class="lrow ${gated ? "veiled" : ""} ${sel ? "sel" : ""}" title="${r.name}: ${money(r.rev)} back · ${r.ads} ads">
      <span class="lname"><span class="dot" style="background:${color}"></span><span class="txt">${r.name}</span></span>
      <div class="barwrap"><div class="bar" style="width:${Math.max(2, r.rev / max * 100)}%; background:${color}"></div></div>
      <span class="lmoney tn">${gated ? "—" : money(r.rev)}</span>
      <span class="lsub tn">${gated ? "" : "$" + r.back.toFixed(2) + " / $1"}</span>
    </div>`;
  };
  return `
    <div class="ledger">
      ${shown.map((r, i) => row(r, i, rows.length)).join("")}
      ${limit < rows.length ? `<div style="padding: 2px 6px"><span style="font-size:11.5px; color:var(--primary); font-weight:500">All ${rows.length} →</span></div>` : ""}
      <div class="lrow" title="Untagged: ${money(un.rev)} · ${un.ads} ads">
        <span class="lname"><span class="dot" style="background:var(--attr-neutral)"></span><span class="txt">No tags yet</span></span>
        <div class="barwrap"><div class="bar" style="width:${Math.max(2, un.rev / max * 100)}%; background:var(--attr-neutral)"></div></div>
        <span class="lmoney tn">${money(un.rev)}</span>
        <span class="lsub tn">${un.ads} ads</span>
      </div>
      ${gated && !opts.quietGate ? `<div class="gate-note"><b>These breakdowns are reading only 58% of your spend.</b> They unlock when 80% of active spend is tagged — tag the 9 biggest untagged ads to get there. The per-ad alerts still run.</div>` : ""}
    </div>`;
}

function adRows(list) {

      <td class="r tn">${money(a.spend)}</td>

      <td class="r tn" style="color:${a.back >= 2 ? "var(--attr-good)" : "var(--attr-warning)"}">$${a.back.toFixed(2)}</td>

              <span class="tn" style="text-align:right; color:var(--foreground)">${val}</span>
            </div>`).join("")}
        </div>
        <p class="footnote" style="padding:0 14px 12px; margin:0">Middle steps are Meta’s modelled counts; orders are ours. Tagged Cold · problem-aware · problem–solution.</p>
      </section>
    </div>`, state);
}

/* 4 — Revenue only, with a seam: no funnel promises until the store pixel lands */
function v4(state) {
  return pageWithDrill(`
    <section class="card">
      <div class="fold-head"><span>Inside problem–solution</span><span class="count">26 ads · top 5 by revenue</span></div>
      <div class="tablewrap"><table class="adtable">
        <thead><tr><th>Ad</th><th class="r">Spend</th><th class="r">Back</th><th class="r">Back / $1</th><th class="r">Orders</th></tr></thead>
        <tbody>
          ${DRILL_ADS.map(a => `<tr>
            <td>${a.name}</td>
            <td class="r tn">${money(a.spend)}</td>
            <td class="r tn">${money(a.rev)}</td>
            <td class="r tn" style="color:${a.back >= 2 ? "var(--attr-good)" : "var(--attr-warning)"}">$${a.back.toFixed(2)}</td>
            <td class="r tn">${Math.max(2, Math.round(a.rev / 60))}</td>
          </tr>`).join("")}
        </tbody>
      </table></div>
      <p class="footnote" style="padding: 8px 12px 10px; margin:0">What happens between the click and the order — page visits, add-to-carts — starts counting when your store’s pixel is installed. <span style="color:var(--primary); font-weight:500">Install it →</span></p>
    </section>`, state);
}

/* 5 — Funnel cards: the drill-in is a grid of mini funnels, one per ad */
function v5(state) {
  const gated = state.coverage === "low";
  return pageWithDrill(`
    <section class="card">
      <div class="fold-head"><span>Inside problem–solution</span><span class="count">26 ads · top 4 by revenue</span></div>
      <div class="mini-grid" style="padding: 0 12px 12px">
        ${DRILL_ADS.slice(0, 4).map(a => `
          <div style="border:1px solid var(--border); border-radius:8px; padding:10px 12px">
            <p style="margin:0 0 6px; font-size:12px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${a.name}</p>
            <div style="display:flex; align-items:baseline; gap:10px; margin-bottom:7px">
              <span class="tn" style="font-size:15px; font-weight:600; color:${a.back >= 2 ? "var(--attr-good)" : "var(--attr-warning)"}">$${a.back.toFixed(2)}</span>
              <span class="footnote">back per $1 · ${money(a.spend)} spent</span>
            </div>
            ${funnelTrio(a, gated)}
            <p class="footnote" style="margin:5px 0 0">${a.land}% land · ${a.atc}% add to cart</p>
          </div>`).join("")}
      </div>
      ${RATIO_NOTE}
    </section>`, state);
}

/* =================== variant registry & picker =================== */
const VARIANTS = [
  { name: "Two columns", sub: "Land % and Add-to-cart % in the table", render: v1 },
  { name: "Bars in rows", sub: "each ad carries its little funnel", render: v2 },
  { name: "The ad sheet", sub: "click an ad, its story opens beside", render: v3 },
  { name: "Revenue only", sub: "no funnel until the pixel lands", render: v4 },
  { name: "Funnel cards", sub: "a grid of mini funnels, one per ad", render: v5 },
];

const state = { variant: 0, coverage: "healthy" };

function readHash() {
  const m = location.hash.match(/v=(\d)/); const s = location.hash.match(/c=(healthy|low)/);
  if (m) state.variant = Math.min(4, Math.max(0, +m[1] - 1));
  if (s) state.coverage = s[1];
}
function writeHash() { history.replaceState(null, "", `#v=${state.variant + 1}&c=${state.coverage}`); }

function render() {
  renderSidebar();
  document.getElementById("main").innerHTML = VARIANTS[state.variant].render(state);
  document.getElementById("vname").textContent = `${state.variant + 1} · ${VARIANTS[state.variant].name}`;
  document.getElementById("vsub").textContent = VARIANTS[state.variant].sub;
  document.getElementById("pdots").innerHTML = VARIANTS.map((_, i) => `<span class="pdot ${i === state.variant ? "on" : ""}"></span>`).join("");
  document.querySelectorAll("#states .st").forEach(b => b.classList.toggle("on", b.dataset.state === state.coverage));
  document.querySelectorAll(".frow-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      const body = btn.nextElementSibling;
      const open = body.hasAttribute("hidden");
      body.toggleAttribute("hidden", !open);
      btn.setAttribute("aria-expanded", String(open));
    });
  });
  writeHash();
}

function step(d) { state.variant = (state.variant + d + VARIANTS.length) % VARIANTS.length; render(); }
document.getElementById("prev").addEventListener("click", () => step(-1));
document.getElementById("next").addEventListener("click", () => step(1));
document.querySelectorAll("#states .st").forEach(b =>
  b.addEventListener("click", () => { state.coverage = b.dataset.state; render(); }));
document.addEventListener("keydown", e => {
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

/* draggable picker */
(() => {
  const el = document.getElementById("picker"), grip = document.getElementById("grip");
  let sx, sy, ox, oy, dragging = false;
  grip.addEventListener("pointerdown", e => {
    dragging = true; grip.setPointerCapture(e.pointerId);
    const r = el.getBoundingClientRect(); sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
    el.style.right = "auto"; el.style.bottom = "auto"; el.style.left = r.left + "px"; el.style.top = r.top + "px";
  });
  grip.addEventListener("pointermove", e => {
    if (!dragging) return;
    el.style.left = Math.min(innerWidth - 60, Math.max(0, ox + e.clientX - sx)) + "px";
    el.style.top = Math.min(innerHeight - 40, Math.max(0, oy + e.clientY - sy)) + "px";
  });
  grip.addEventListener("pointerup", () => { dragging = false; });
})();

readHash();
render();
</script>
