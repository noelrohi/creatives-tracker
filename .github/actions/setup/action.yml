name: Setup
description: Install Bun and restore/install dependencies. Requires actions/checkout to have run first.

runs:
  using: composite
  steps:
    # Pinned, not `latest`: a Bun release should never break CI on a day we
    # didn't touch it. Bump deliberately alongside the local toolchain.
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Restore Bun install cache
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
