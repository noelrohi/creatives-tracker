name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are worth cancelling; a main push is a deploy and must
  # be allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job count is a cost lever, not just a layout choice: GitHub rounds every job
# up to a whole minute individually, so a 5s job bills the same as a 55s one.
# The short checks are grouped into `static` for that reason.
#
# Splitting only pays where it shortens the critical path. On a PR that path is
# `build` (~124s); the unit suite runs ~119s including setup, so sharding it
# bought no wall clock there and cost a billed minute per extra shard. Keep it
# as one job until it outgrows the build.

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ github.sha }}
          restore-keys: eslint-${{ runner.os }}-

      # --concurrency=auto fans linting across every core (ESLint >= 9.34);
      # --cache skips files unchanged since the last run.
      - name: Lint
        run: bun run lint --concurrency=auto --cache

      - name: Typecheck
        run: bun run typecheck

      # Only needs `git show <base>:drizzle/meta/_journal.json`, which a shallow
      # fetch of the base ref satisfies — no full history required.
      - name: Migration guard
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1 --quiet
          node scripts/check-migrations.mjs

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: bun run test

  components:
    name: Component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Component tests
        run: bun run test:components

  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders; nothing connects during `next build`.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Build
        run: bun run build

  trigger-deploy:
    name: Deploy Trigger.dev production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static, test, components]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Deploy Trigger.dev production
        run: bun run trigger:deploy -- --env prod

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static, test, components]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Pull Vercel production configuration
        run: bunx vercel pull --yes --environment=production

      - name: Build production artifacts
        run: bunx vercel build --prod

      - name: Deploy production artifacts
        run: bunx vercel deploy --prebuilt --prod
